<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Chat API - Test Client</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="/static/app.css" />
    </head>
    <body>
        <!-- Top header: title left, name + change + status right -->
        <nav class="navbar navbar-expand bg-body-tertiary">
            <div class="container-fluid">
        <a class="navbar-brand" href="#">CHATCLIENT</a>
        <span id="status-badge" class="badge text-bg-secondary ms-2">Disconnected</span>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span id="current-name" class="text-muted small"></span>
            <button
                id="changeNameBtn"
                class="btn btn-outline-secondary btn-sm"
                type="button"
            >
                Change name
            </button>
        </div>
            </div>
        </nav>

        <!-- Sub bar: theme switch on lighter background -->
        <div class="py-2 bg-body-secondary border-bottom">
            <div class="container d-flex justify-content-end">
                <div class="form-check form-switch">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        role="switch"
                        id="themeToggle"
                    />
                    <label class="form-check-label" for="themeToggle"
                        >Dark mode</label
                    >
                </div>
            </div>
        </div>

        <!-- Main content: users list on the left, chat on the right -->
        <div class="container py-3">
            <div class="row g-3">
                <aside class="col-12 col-md-3">
                    <div class="card">
                        <div class="card-header">Users</div>
                        <ul id="users" class="list-group list-group-flush"></ul>
                    </div>
                </aside>
                <main class="col-12 col-md-9">
                    <div
                        id="log"
                        class="border rounded p-2 mb-3"
                        style="height: 50vh; overflow: auto"
                    ></div>
                    <form id="bar" class="input-group">
                        <input
                            id="text"
                            class="form-control"
                            type="text"
                            placeholder="Type a message..."
                            autocomplete="off"
                        />
                        <button type="submit" class="btn btn-primary">
                            Send
                        </button>
                    </form>
                </main>
            </div>
        </div>
        <!-- Name modal -->
        <div class="modal fade" id="nameModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="nameForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Choose a display name</h5>
                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"
                            aria-label="Close"
                        ></button>
                    </div>
                    <div class="modal-body">
                        <label for="nameInput" class="form-label"
                            >Display name</label
                        >
                        <input
                            id="nameInput"
                            type="text"
                            class="form-control"
                            placeholder="Your name"
                            maxlength="30"
                            required
                        />
                        <div class="form-text">
                            This name is visible to others in the room.
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button
                            type="button"
                            class="btn btn-secondary"
                            data-bs-dismiss="modal"
                        >
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script src="/static/app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"
        ></script>
        <script src="/static/theme.js"></script>
        <script src="/static/name.js"></script>
    </body>
</html>
