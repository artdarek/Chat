[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "chatapi"
version = "0.1.0"
description = "Chat API with FastAPI and a simple demo client"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "httpx>=0.24",
  "ruff>=0.6",
  "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build]
include = [
  "src/server/**",
  "src/client/**",
  "src/client/static/**",
  "src/client/templates/**",
]
