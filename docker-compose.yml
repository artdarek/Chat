version: "3.9"

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "8000:8000"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn client.main:app --host 0.0.0.0 --port 8001
    environment:
      - PYTHONPATH=/app/src
    ports:
      - "8001:8001"
    restart: unless-stopped

